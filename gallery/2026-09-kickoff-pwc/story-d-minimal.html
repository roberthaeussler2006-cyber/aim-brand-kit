<!doctype html>
<!-- Option D "Minimal" - type only, centred, nothing else. 1080x1920. -->
<html lang="de"><head><meta charset="utf-8"><title>AIM Kickoff - Minimal</title>
<link rel="stylesheet" href="_base.css">
<style>
  .stage { background: var(--ink); color: var(--paper); }
  .halo {
    position: absolute; left: 50%; top: 50%; width: 1500px; height: 1500px; transform: translate(-50%,-50%);
    background: radial-gradient(circle at 50% 50%, rgba(110,86,207,0.34) 0%, rgba(76,42,133,0.16) 38%, rgba(15,17,21,0) 68%);
  }
  .content {
    position: absolute; inset: 0; padding: 206px 92px 250px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
  }
  .brand svg { width: 150px; display: block; }
  .brand .submark { margin-top: 13px; color: rgba(250,250,248,0.55); }

  .mid { margin: auto 0; display: flex; flex-direction: column; align-items: center; }
  .mid .eyebrow { color: var(--glow); }
  h1 {
    margin-top: 40px;
    font-size: 152px; font-weight: 700; line-height: 0.86; letter-spacing: -0.055em;
  }
  h1 em { font-style: normal; color: var(--glow); }
  .tick { margin-top: 52px; width: 64px; height: 3px; background: var(--purple); }
  .when { margin-top: 52px; font-size: 44px; font-weight: 700; letter-spacing: -0.03em; line-height: 1.24; }
  .when span { color: rgba(250,250,248,0.55); font-weight: 400; }
  .where { margin-top: 20px; font-size: 27px; line-height: 1.45; color: rgba(250,250,248,0.60); }
  .speaker { margin-top: 46px; font-size: 27px; line-height: 1.5; color: rgba(250,250,248,0.68); max-width: 720px; }
  .speaker b { font-weight: 700; color: var(--paper); }

  .foot { display: flex; flex-direction: column; align-items: center; }
  .foot .pill {
    background: var(--purple); color: #fff; font-size: 30px; font-weight: 700;
    letter-spacing: -0.015em; padding: 25px 52px; border-radius: 999px;
  }
  .foot .url { margin-top: 24px; font-size: 24px; color: rgba(250,250,248,0.45); letter-spacing: 0.02em; }
</style></head>
<body><div class="stage">
  <div class="halo"></div>
  <div class="grain" style="opacity:.05; mix-blend-mode:overlay"></div>

  <div class="content">
    <div class="brand">
      <svg viewBox="0 0 380 82" fill="#FAFAF8"><g transform="translate(0,82) scale(0.1,-0.1)">
        <path d="M677 568 c-40 -71 -227 -425 -227 -430 0 -8 63 1 71 10 4 4 51 90 104 192 53 102 100 189 104 193 4 4 54 -83 111 -193 57 -110 109 -200 115 -200 5 0 20 -3 33 -6 13 -4 22 -2 22 5 0 7 -55 115 -122 241 -121 226 -123 230 -155 230 -27 0 -36 -6 -56 -42z"/>
        <path d="M1540 375 l0 -235 30 0 30 0 0 235 0 235 -30 0 -30 0 0 -235z"/>
        <path d="M2122 373 l3 -237 30 0 30 0 5 189 5 188 116 -121 c65 -67 121 -122 127 -122 5 0 60 54 122 120 61 66 115 120 118 120 4 0 6 -83 4 -185 l-3 -185 36 0 35 0 0 235 0 235 -34 0 c-31 0 -47 -13 -158 -126 l-123 -126 -123 126 c-111 114 -126 126 -158 126 l-34 0 2 -237z"/>
      </g></svg>
      <div class="submark">AI in Management Club</div>
    </div>

    <div class="mid">
      <div class="eyebrow">Herbstsemester 26</div>
      <h1>Kickoff<br>mit <em>PwC</em></h1>
      <div class="tick"></div>
      <div class="when">Mi, 23. September<br><span>16.00 – 17.30 Uhr</span></div>
      <div class="where">SQUARE, Universität St. Gallen<br>Räume Vadian &amp; Gallus</div>
      <p class="speaker"><b>Keynote: Matteo Biondi</b><br>Director AI &amp; Data bei PwC, davor McKinsey.<br>Danach Q&amp;A, Apéro und Networking.</p>
    </div>

    <div class="foot">
      <div class="pill">Jetzt anmelden</div>
      <div class="url">aim-club.ch/events</div>
    </div>
  </div>
</div></body></html>
